<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Login | ChatApp</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 100px; background: #f7f7f7; }
    input, button { padding: 10px; margin: 10px; width: 250px; font-size: 16px; }
    button { cursor: pointer; background: #4CAF50; color: white; border: none; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
  <h2>Willkommen bei ChatApp</h2>
  <input type="email" id="email" placeholder="Email"><br>
  <input type="password" id="password" placeholder="Passwort"><br>
  <button onclick="login()">Login</button>
  <button onclick="register()">Registrieren</button>

  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const auth = firebase.auth();

    function login() {
      const email = email.value;
      const password = password.value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => window.location.href = "chat.html")
        .catch(err => alert(err.message));
    }

    function register() {
      const email = email.value;
      const password = password.value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => window.location.href = "chat.html")
        .catch(err => alert(err.message));
    }
  </script>
</body>
</html>
